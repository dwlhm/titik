name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
          swift --version

      - name: Build Dynamic Plugins
        run: make plugins

      - name: Run Test Suite
        run: make test

      - name: Build Application Bundle
        run: make bundle
