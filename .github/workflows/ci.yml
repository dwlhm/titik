name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Cache Swift PM Build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Check Code Formatting
        run: make format-check

      - name: Run SwiftLint Check
        run: make lint

      - name: Run Fast-Fail Modular Unit Tests
        run: make test-unit

      - name: Build Release Binaries and Application Bundle
        run: make bundle
