name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
          swift --version

      - name: Build Plugins and Application Bundle
        run: |
          make plugins
          make bundle

      - name: Package Release Assets
        run: |
          cd bin
          zip -r ../Titik-macOS-arm64.zip Titik.app
          cd ..
          shasum -a 256 Titik-macOS-arm64.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Titik-macOS-arm64.zip
            checksums.txt
          generate_release_notes: true
