name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Cache Swift PM Build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Verification Pipeline (Format Check, Lint, Full Test Suite, Bundle)
        run: make pipeline

      - name: Package Release Assets
        run: |
          cd bin
          zip -r ../Titik-macOS-arm64.zip Titik.app
          cd ..
          shasum -a 256 Titik-macOS-arm64.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Titik-macOS-arm64.zip
            checksums.txt
          generate_release_notes: true
